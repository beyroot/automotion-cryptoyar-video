name: CryptoYar daily motion

on:
  schedule:
    - cron: "30 15 * * *"   # ۱۹:۰۰ تهران (کلیپ اول)
    - cron: "30 18 * * *"   # ۲۲:۰۰ تهران (کلیپ دوم)
  workflow_dispatch:
    inputs:
      id: { description: "شناسهٔ اپیزود (اختیاری، مثل ep07)", required: false }
      slot: { description: "نوبت: 1 = ساعت ۱۹، 2 = ساعت ۲۲ (اختیاری)", required: false }
      publish: { description: "منتشر شود؟", type: boolean, default: true }

permissions:
  contents: write

concurrency:
  group: daily-clips
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Render and publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EP_ID: ${{ inputs.id }}
          SLOT: ${{ inputs.slot || (github.event.schedule == '30 18 * * *' && '2') || (github.event.schedule == '30 15 * * *' && '1') || '' }}
          PUBLISH: ${{ inputs.publish }}
        run: node src/daily.mjs ${EP_ID:+--id "$EP_ID"} ${SLOT:+--slot "$SLOT"} $([ "$PUBLISH" = "false" ] && echo --no-publish)
      - name: Save the day's clips in the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clips
          if git diff --cached --quiet; then
            echo "no new clip files"
            exit 0
          fi
          dates=$(git diff --cached --name-only | awk -F/ '/^clips\// {print $2}' | sort -u | paste -sd, -)
          git commit -m "clips: ${dates}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
